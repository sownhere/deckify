name: Bug report
description: Report a problem with Deckify
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: input
    id: device
    attributes:
      label: Device / iOS version
      placeholder: "iPhone 17 Pro, iOS 26.0"
  - type: input
    id: version
    attributes:
      label: Deckify version / commit
