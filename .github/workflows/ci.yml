name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint

      # If the runner's Xcode doesn't ship this simulator, update the name below.
      - name: Build & test
        run: |
          xcodebuild \
            -project deckify.xcodeproj \
            -scheme "Deckify Dev Debug" \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            clean test
