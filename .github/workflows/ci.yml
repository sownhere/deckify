name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Check for code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**/*.swift'
              - '**/*.xcconfig'
              - 'deckify.xcodeproj/**'
              - '.github/workflows/ci.yml'

      - name: Select latest Xcode
        if: steps.filter.outputs.code == 'true'
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install SwiftLint
        if: steps.filter.outputs.code == 'true'
        run: brew install swiftlint

      - name: Lint
        if: steps.filter.outputs.code == 'true'
        run: swiftlint

      - name: Resolve simulator destination
        if: steps.filter.outputs.code == 'true'
        id: destination
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '.devices | to_entries | map(select(.key | test("iOS"))) | sort_by(.key) | last
                     | .value | map(select(.name | test("iPhone"))) | .[0].udid')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test
        if: steps.filter.outputs.code == 'true'
        run: |
          xcodebuild \
            -project deckify.xcodeproj \
            -scheme "Deckify Dev Debug" \
            -destination "id=${{ steps.destination.outputs.udid }}" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            clean test
